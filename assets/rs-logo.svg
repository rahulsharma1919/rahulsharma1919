<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">RS, Rahul Sharma</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020024"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font: 800 168px "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: url(#accent); }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 2.2s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .draw { animation: none; stroke-dashoffset: 0; } }
  </style>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <path class="draw" d="M256,70 L417,163 L417,349 L256,442 L95,349 L95,163 Z"
        fill="none" stroke="url(#accent)" stroke-width="10" stroke-linejoin="round" filter="url(#glow)"/>
  <text class="mono" x="256" y="315" text-anchor="middle">RS</text>
</svg>
