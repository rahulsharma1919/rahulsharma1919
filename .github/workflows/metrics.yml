# GitHub stats and top languages, generated here instead of on a shared public
# server that is often rate-limited. With a personal token it also counts work in
# private repositories. Writes metrics.svg to the `metrics` branch.
#
# One-time setup: create a classic personal access token with the `repo` and
# `read:user` scopes, and save it in this repo as the Actions secret METRICS_TOKEN.
name: Generate metrics

on:
  schedule:
    - cron: '30 */12 * * *' # twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # metrics writes to an existing branch but won't create one: make it once, empty.
      - uses: actions/checkout@v4
      - name: Create the metrics branch on the first run
        run: |
          if ! git ls-remote --exit-code --heads origin metrics > /dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch --orphan metrics
            git commit --allow-empty -m "chore: start the metrics branch"
            git push origin metrics
          fi

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          committer_branch: metrics
          committer_message: 'chore: update metrics'
          config_timezone: Asia/Kolkata
          config_display: large
          base: activity, community, repositories
          repositories_affiliations: owner, collaborator
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_ignored: jupyter notebook
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
